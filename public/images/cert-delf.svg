<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 90">
  <!-- Left side: France Education International -->
  <text x="8" y="24" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="bold" fill="#003189">FRANCE</text>
  <text x="8" y="38" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="bold" fill="#009FE3">ÉDUCATION</text>
  <text x="8" y="52" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="bold" fill="#009FE3">INTERNATIONALE</text>
  <!-- French flag accent -->
  <rect x="8" y="57" width="10" height="4" fill="#002395"/>
  <rect x="18" y="57" width="10" height="4" fill="white" stroke="#ccc" stroke-width="0.5"/>
  <rect x="28" y="57" width="10" height="4" fill="#ED2939"/>
