---
# ════════════════════════════════════════════════════════════════════════════
# Deploy automatico per scuoleLive (Laravel 12) su cPanel/Aruba (aeacenter)
# ════════════════════════════════════════════════════════════════════════════
#
# Struttura sul server:
#   /home/aeacenter/scuole_app/   -> Codice Laravel (app, vendor, storage, ecc.)
#   /home/aeacenter/public_html/  -> Document root pubblico (contenuto di /public)
#
# Repository cPanel (sorgente del deploy):
#   /home/aeacenter/repositories/scuole-live/
#
# ────────────────────────────────────────────────────────────────────────────
#  CRON OBBLIGATORIO — configurare in cPanel → Cron Jobs:
#
#    * * * * * /usr/bin/php /home/aeacenter/scuole_app/artisan schedule:run >> /dev/null 2>&1
#
#  Senza questo cron NON funzionano:
#    • backup notturno (02:00) e settimanale (domenica 03:00)
#    • promemoria rate (09:00)
#    • notifiche CRM follow-up (08:00)
#    • monitor backup (08:30)
#    • notifiche programmate studenti (ogni 5 minuti)
#    • riconciliazione conteggi lezioni (03:30)
# ────────────────────────────────────────────────────────────────────────────
#
#  Worker code (RACCOMANDATO):
#    * * * * * /usr/bin/php /home/aeacenter/scuole_app/artisan queue:work --stop-when-empty --tries=3 >> /dev/null 2>&1
# ════════════════════════════════════════════════════════════════════════════

deployment:
  tasks:
    # ----------------------------------------------------------------
    # 0. Variabili
    # ----------------------------------------------------------------
    - export APP_PATH=/home/aeacenter/scuole_app
    - export PUBLIC_PATH=/home/aeacenter/public_html
    - export DEPLOY_LOG=$APP_PATH/storage/logs/deploy.log

    # ----------------------------------------------------------------
    # 1. Sicurezza: assicurati che le cartelle esistano
    # ----------------------------------------------------------------
    - /bin/mkdir -p $APP_PATH
    - /bin/mkdir -p $PUBLIC_PATH
    - /bin/mkdir -p $APP_PATH/storage/logs
    - /bin/mkdir -p $APP_PATH/storage/framework/cache
    - /bin/mkdir -p $APP_PATH/storage/framework/sessions
    - /bin/mkdir -p $APP_PATH/storage/framework/views
    - /bin/mkdir -p $APP_PATH/bootstrap/cache

    # ----------------------------------------------------------------
    # Marker inizio deploy nel log (utile per separare le run)
    # ----------------------------------------------------------------
    - /bin/echo "===== DEPLOY $(/bin/date '+%Y-%m-%d %H:%M:%S') =====" >> $DEPLOY_LOG

    # ----------------------------------------------------------------
    # 1b. Diagnostica ambiente (utile per debug deploy futuri)
    #     IMPORTANTE: ogni stringa che contiene ": " (colon+space) DEVE essere
    #     quotata, altrimenti il parser YAML di cPanel rifiuta tutto il file
    #     e nessuna task viene eseguita.
    # ----------------------------------------------------------------
    - '/bin/echo "--- ENV DIAG ---" >> $DEPLOY_LOG'
    - '/bin/echo "User=$(/usr/bin/whoami) Home=$HOME" >> $DEPLOY_LOG'
    - '/usr/bin/which php composer 2>&1 | /usr/bin/tee -a $DEPLOY_LOG || true'
    - '/opt/cpanel/ea-php83/root/usr/bin/php -v 2>&1 | /usr/bin/tee -a $DEPLOY_LOG || /bin/echo "ea-php83 NOT found at expected path" >> $DEPLOY_LOG'
    - '/bin/ls -la /usr/local/bin/composer /opt/cpanel/composer/bin/composer /home/aeacenter/composer.phar 2>&1 | /usr/bin/tee -a $DEPLOY_LOG || true'

    # ----------------------------------------------------------------
    # 2. Copia il codice dell'app (TUTTO TRANNE /public) -> scuole_app
    #    --delete tiene scuole_app perfettamente allineato al repo
    #    ATTENZIONE: i file in --exclude NON vengono toccati
    #
    #    --exclude='vendor/' è CRITICO: il repo non contiene il vendor completo
    #    (solo i file autoload). Senza esclusione, rsync --delete cancella il
    #    vendor reale dal server, mandando giù il sito.
    # ----------------------------------------------------------------
    - >
      /usr/bin/rsync -av --delete
      --exclude='.git/'
      --exclude='.gitignore'
      --exclude='.gitattributes'
      --exclude='.cpanel.yml'
      --exclude='.env'
      --exclude='.env.*'
      --exclude='.envOLD'
      --exclude='node_modules/'
      --exclude='public/'
      --exclude='tests/'
      --exclude='_server_backup/'
      --exclude='vendor/'
      --exclude='*.docx'
      --exclude='*.bat'
      --exclude='*.bak'
      --exclude='*.conf'
      --exclude='vendor.zip'
      --exclude='storage/logs/*.log'
      --exclude='storage/framework/cache/data/'
      --exclude='storage/framework/sessions/*'
      --exclude='storage/framework/views/*'
      --exclude='storage/app/public/'
      ./ $APP_PATH/

    # ----------------------------------------------------------------
    # 3. Copia il contenuto di /public -> public_html
    #    NB: niente --delete qui, public_html può contenere file di servizio
    #    (es. cgi-bin, .well-known per Let's Encrypt). Se vuoi mirror puro,
    #    metti --delete-after --exclude='cgi-bin' --exclude='.well-known'
    # ----------------------------------------------------------------
    - >
      /usr/bin/rsync -av
      --exclude='hot'
      --exclude='storage'
      ./public/ $PUBLIC_PATH/

    # ----------------------------------------------------------------
    # 4. Patch di public_html/index.php per puntare a scuole_app
    #    Laravel 11/12 usa __DIR__.'/../' per raggiungere bootstrap, vendor,
    #    storage. Riscriviamo questi 3 path in assoluto.
    # ----------------------------------------------------------------
    - /bin/sed -i "s|__DIR__\.'/\.\./storage|'/home/aeacenter/scuole_app/storage|g" $PUBLIC_PATH/index.php
    - /bin/sed -i "s|__DIR__\.'/\.\./vendor|'/home/aeacenter/scuole_app/vendor|g" $PUBLIC_PATH/index.php
    - /bin/sed -i "s|__DIR__\.'/\.\./bootstrap|'/home/aeacenter/scuole_app/bootstrap|g" $PUBLIC_PATH/index.php

    # ----------------------------------------------------------------
    # 5. Symlink storage pubblico (sostituisce php artisan storage:link)
    #    public_html/storage -> /home/aeacenter/scuole_app/storage/app/public
    # ----------------------------------------------------------------
    - /bin/mkdir -p $APP_PATH/storage/app/public
    - /bin/rm -rf $PUBLIC_PATH/storage
    - /bin/ln -nfs $APP_PATH/storage/app/public $PUBLIC_PATH/storage

    # ----------------------------------------------------------------
    # 6. Permessi
    # ----------------------------------------------------------------
    - /bin/chmod -R 755 $APP_PATH
    - /bin/chmod -R 775 $APP_PATH/storage
    - /bin/chmod -R 775 $APP_PATH/bootstrap/cache

    # ----------------------------------------------------------------
    # 7. Composer install — auto-detect del binary
    #    Su cPanel/Aruba shared, "composer" non è in PATH per il deploy.
    #    Cerchiamo in posizioni note; se non trova nulla, skip.
    #    Workaround consigliato: caricare composer.phar in ~/composer.phar
    #    via FTP, così questo step lo userà via php cli.
    # ----------------------------------------------------------------
    - |
      COMPOSER_BIN=""
      PHP_CLI=/opt/cpanel/ea-php83/root/usr/bin/php
      if [ -x /usr/local/bin/composer ]; then
          COMPOSER_BIN=/usr/local/bin/composer
      elif [ -x /opt/cpanel/composer/bin/composer ]; then
          COMPOSER_BIN=/opt/cpanel/composer/bin/composer
      elif [ -f /home/aeacenter/composer.phar ] && [ -x "$PHP_CLI" ]; then
          COMPOSER_BIN="$PHP_CLI /home/aeacenter/composer.phar"
      fi
      if [ -n "$COMPOSER_BIN" ]; then
          /bin/echo "Composer: $COMPOSER_BIN" >> $DEPLOY_LOG
          cd $APP_PATH && $COMPOSER_BIN install --no-dev --optimize-autoloader --no-interaction 2>&1 | /usr/bin/tee -a $DEPLOY_LOG
      else
          /bin/echo "composer non disponibile in deploy. Carica composer.phar in /home/aeacenter/ via FTP per abilitare composer install automatico." >> $DEPLOY_LOG
      fi

    # ----------------------------------------------------------------
    # 7b. Esegui migration — CRITICO: non saltare mai questo step.
    #     --force obbligatorio in produzione (bypassa la conferma interattiva).
    #     Path PHP CLI: ea-php83 (NON /usr/bin/php che è la versione CGI).
    # ----------------------------------------------------------------
    - cd $APP_PATH && /opt/cpanel/ea-php83/root/usr/bin/php artisan migrate --force 2>&1 | /usr/bin/tee -a $DEPLOY_LOG || /bin/echo "migrate fallito, vedere log" >> $DEPLOY_LOG

    # ----------------------------------------------------------------
    # 8. Pulizia cache stale + ricostruzione cache produzione
    #    optimize:clear → rimuove config/route/view cache vecchie
    #    optimize      → ricrea config + route + events cache
    # ----------------------------------------------------------------
    - cd $APP_PATH && /opt/cpanel/ea-php83/root/usr/bin/php artisan optimize:clear 2>&1 | /usr/bin/tee -a $DEPLOY_LOG || true
    - cd $APP_PATH && /opt/cpanel/ea-php83/root/usr/bin/php artisan optimize 2>&1 | /usr/bin/tee -a $DEPLOY_LOG || true

    # ----------------------------------------------------------------
    # 8b. Cache view (Blade compilate)
    # ----------------------------------------------------------------
    - cd $APP_PATH && /opt/cpanel/ea-php83/root/usr/bin/php artisan view:cache 2>&1 | /usr/bin/tee -a $DEPLOY_LOG || true

    # ----------------------------------------------------------------
    # 8c. Cache event listeners
    # ----------------------------------------------------------------
    - cd $APP_PATH && /opt/cpanel/ea-php83/root/usr/bin/php artisan event:cache 2>&1 | /usr/bin/tee -a $DEPLOY_LOG || true

    # ----------------------------------------------------------------
    # 8d. Filament cache (componenti, risorse, navigation)
    # ----------------------------------------------------------------
    - cd $APP_PATH && /opt/cpanel/ea-php83/root/usr/bin/php artisan filament:optimize 2>&1 | /usr/bin/tee -a $DEPLOY_LOG || true

    # ----------------------------------------------------------------
    # 9. Restart graceful dei worker queue
    #    Senza questo, i worker continuano a usare il vecchio codice in memoria.
    #    Il flag --tries è per il queue:work avviato dal supervisor/cron.
    # ----------------------------------------------------------------
    - cd $APP_PATH && /opt/cpanel/ea-php83/root/usr/bin/php artisan queue:restart 2>&1 | /usr/bin/tee -a $DEPLOY_LOG || true

    # ----------------------------------------------------------------
    # 9b. Health check post-deploy (solo log, non blocca il deploy)
    #     Senza --strict: exit 0 anche su WARN, exit 2 solo su FAIL.
    #     L'esito completo è nel deploy.log — controllarlo via File Manager.
    # ----------------------------------------------------------------
    - /bin/echo "----- HEALTH CHECK $(/bin/date '+%Y-%m-%d %H:%M:%S') -----" >> $DEPLOY_LOG
    - cd $APP_PATH && /opt/cpanel/ea-php83/root/usr/bin/php artisan school:health-check 2>&1 | /usr/bin/tee -a $DEPLOY_LOG || true

    # ----------------------------------------------------------------
    # 10. Marker fine deploy
    # ----------------------------------------------------------------
    - /bin/echo "===== DEPLOY OK $(/bin/date '+%Y-%m-%d %H:%M:%S') =====" >> $DEPLOY_LOG
